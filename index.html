<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Артроскопия локтя</title>
<style>
:root{color-scheme:dark;--bg:#121827;--glass:rgba(22,29,46,.66);--line:rgba(255,255,255,.12);--text:#e9edf5;--muted:#9aa6bd;--blue:#4a90f5;--red:#ee5d74;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(40vw 40vw at 15% 10%,rgba(74,144,245,.4),transparent 70%),radial-gradient(36vw 36vw at 85% 20%,rgba(164,135,247,.32),transparent 70%),
  radial-gradient(40vw 40vw at 70% 85%,rgba(238,93,116,.22),transparent 70%),linear-gradient(160deg,#18213a,#121827 55%,#1a1626)}
form{width:min(380px,100%);background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:28px 26px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:grid;gap:14px}
.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:300;font-size:26px}
p{margin:0;color:var(--muted);font-size:13px}
input{width:100%;background:rgba(10,14,24,.5);border:1px solid var(--line);border-radius:4px;padding:11px 12px;color:var(--text);font:inherit}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{color:var(--red);min-height:1.4em;font-size:13px}
label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<form id="f" autocomplete="off">

  <input id="pw" type="password" placeholder="Пароль" aria-label="Пароль" autofocus>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:P.i, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.v)}, key, b64(P.d));   // неверный пароль -> исключение
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value; if (!pw) return;
  go.disabled = true; err.textContent = ""; go.textContent = "Открываю…";
  try {
    if (document.getElementById("rem").checked) { try { sessionStorage.setItem("kol-pw", pw); } catch(_){} }
    await unlock(pw);
  } catch(_) {
    try { sessionStorage.removeItem("kol-pw"); } catch(_){}
    err.textContent = "Неверный пароль."; go.disabled = false; go.textContent = "Открыть";
  }
});
try { const s = sessionStorage.getItem("kol-pw"); if (s) unlock(s).catch(() => sessionStorage.removeItem("kol-pw")); } catch(_){}
